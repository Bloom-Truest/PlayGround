<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>The Spike: Cross (Inspired)</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="menu" class="screen">
      <div class="title">THE SPIKE</div>
      <div class="subtitle">CROSS-INSPIRED</div>
      <button id="btnPlay">PLAY</button>
      <button id="btnRoster">ROSTER (44)</button>
      <div class="hint">WASD move | Space jump/hit | F First Serve | R serve</div>
    </div>
    <div id="roster" class="screen hidden">
      <div class="rosterHead">ROSTER</div>
      <div id="rosterList"></div>
      <button id="btnBackMenu">BACK</button>
    </div>
    <div id="select" class="screen hidden">
      <div class="selectHead">SELECT YOUR PLAYER</div>
      <div id="selectGrid"></div>
      <button id="btnStartMatch">START MATCH</button>
      <button id="btnBackMenu2">BACK</button>
    </div>
    <div id="hud" class="hidden">
      <div id="scoreboard">
        <span id="team0Name">YOU</span>
        <span id="score0">0</span>
        <span class="sep">-</span>
        <span id="score1">0</span>
        <span id="team1Name">CPU</span>
      </div>
      <div id="sets">Sets: <span id="sets0">0</span> - <span id="sets1">0</span></div>
      <div id="info"></div>
      <div id="controls">
        <button class="cbtn" id="cUp">FWD</button>
        <button class="cbtn" id="cDown">BACK</button>
        <button class="cbtn" id="cLeft">LEFT</button>
        <button class="cbtn" id="cRight">RIGHT</button>
        <button class="cbtn" id="cJump">JUMP</button>
        <button class="cbtn" id="cServe">SERVE</button>
        <button class="cbtn" id="cFirst">FIRST</button>
      </div>
    </div>
    <div id="pointBanner" class="hidden"></div>
    <div id="matchEnd" class="screen hidden">
      <div id="matchResult"></div>
      <button id="btnRematch">REMATCH</button>
      <button id="btnMenu">MENU</button>
    </div>
    <div id="loading">Loading 3D engine...</div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/game.js"></script>
</body>
</html>
